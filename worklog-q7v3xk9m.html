<style>
:root{--bg:#f4f1ea;--ink:#111311;--accent:#ff5b1f}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:380px;border:1px solid var(--ink);border-radius:20px;padding:34px 30px 28px;background:var(--bg)}

p{margin:0 0 18px;font-size:14px;color:#5d5f5a}
input{width:100%;box-sizing:border-box;padding:12px 14px;font:inherit;font-size:15px;border:1px solid rgba(17,19,17,.35);border-radius:12px;background:transparent;color:var(--ink);outline:none}
input:focus{border-color:var(--ink)}
button{margin-top:12px;width:100%;padding:12px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
button:hover{background:var(--accent);border-color:var(--accent)}
.err{display:none;margin-top:12px;font-size:13px;color:var(--accent)}
</style></head><body>

async function open(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(IV)},key,dec(CT));
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
