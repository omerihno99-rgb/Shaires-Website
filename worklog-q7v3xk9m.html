.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

button:hover{background:var(--accent);border-color:var(--accent)}
.err{display:none;margin-top:12px;font-size:13px;color:var(--accent)}

async function open(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(IV)},key,dec(CT));
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
