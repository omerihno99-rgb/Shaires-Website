<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Private</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--ink:#111311;--accent:#ff5b1f;--muted:#5d5f5a}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:380px;border:1px solid var(--ink);border-radius:20px;padding:34px 30px 30px;background:var(--bg)}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:28px;margin:0 0 6px;letter-spacing:-.01em} h1 em{font-style:italic;color:var(--accent)}
p{margin:0 0 22px;font-size:14px;color:var(--muted)}
.boxes{display:flex;gap:12px;justify-content:space-between}
.boxes input{width:0;flex:1 1 0;aspect-ratio:1/1.15;max-width:72px;font:500 28px 'JetBrains Mono',monospace;text-align:center;color:var(--ink);
  background:transparent;border:1px solid rgba(17,19,17,.35);border-radius:14px;outline:none;caret-color:var(--accent);
  transition:background .15s ease,border-color .15s ease,color .15s ease,transform .15s ease;-webkit-appearance:none;appearance:none}
.boxes input:focus{border-color:var(--ink)}
.boxes input.full{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.boxes input.full:focus{border-color:var(--accent)}
.boxes.bad input{border-color:var(--accent);animation:shake .4s}
.boxes.busy input{opacity:.55}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.err{min-height:20px;margin:14px 0 0;font-size:13px;color:var(--accent);opacity:0;transition:opacity .2s}
.err.show{opacity:1}
</style></head><body>

const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(code){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(IV)},key,dec(CT));
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
const boxes=document.getElementById('boxes'), inputs=[...boxes.querySelectorAll('input')], err=document.getElementById('err');
let busy=false;
function paint(){ inputs.forEach(i=>i.classList.toggle('full', i.value.length===1)); }
function value(){ return inputs.map(i=>i.value).join(''); }
function reset(){ inputs.forEach(i=>i.value=''); paint(); inputs[0].focus(); }
async function submit(){
  if (busy) return; const code=value(); if (code.length!==4) return;
  busy=true; boxes.classList.add('busy'); err.classList.remove('show');
  try{ await open(code); try{sessionStorage.setItem('wl-code',code);}catch(_){} }
  catch(_){ busy=false; boxes.classList.remove('busy'); boxes.classList.add('bad'); err.classList.add('show');
    setTimeout(()=>{ boxes.classList.remove('bad'); reset(); }, 450); }
}
inputs.forEach((inp,i)=>{
  inp.addEventListener('input', e=>{
    const v=inp.value.replace(/\D/g,'');
    if (v.length>1){ // a paste of several digits
      v.split('').slice(0,4-i).forEach((ch,k)=>inputs[i+k].value=ch);
      paint(); (inputs[Math.min(i+v.length,3)]).focus(); if (value().length===4) submit(); return; }
    inp.value=v; paint();
    if (v && i<3) inputs[i+1].focus();
    if (value().length===4) submit();
  });
  inp.addEventListener('keydown', e=>{
    if (e.key==='Backspace' && !inp.value && i>0){ inputs[i-1].value=''; paint(); inputs[i-1].focus(); e.preventDefault(); }
    if (e.key==='ArrowLeft' && i>0) inputs[i-1].focus();
    if (e.key==='ArrowRight' && i<3) inputs[i+1].focus();
  });
  inp.addEventListener('focus', ()=>inp.select());
});
document.getElementById('f').addEventListener('submit', e=>{ e.preventDefault(); submit(); });
try{ const s=sessionStorage.getItem('wl-code'); if(s&&s.length===4) open(s).catch(()=>{}); }catch(_){}
</script></body></html>
